# Builds and smoke-tests the macOS disk images, one per architecture.
#
# There is no Mac in the team's build setup, so this is where the macOS build
# is made and checked: tools/build/assemble-bundle.sh (the bundle),
# yarn dist:mac:<arch> (the .dmg, ad-hoc signed by tools/build/mac-adhoc-sign.js)
# tools/build/mac-smoke-test.sh (backend, packaging, launch and quit) and
# tools/build/ui-smoke.mjs (the window itself: 2D and 3D drawn, a file opened
# like a double-click, a drawing saved, a report made; screenshots attached).
# What it can't judge is how it looks on a real Mac's GPU; README "Building
# for macOS" lists what a person with a Mac should try.
#
# The .dmg files are attached to each run as artifacts (kept 14 days).
name: macOS build

on:
  # Mac runner minutes count about 10x against the account's free Actions
  # minutes (the runs stopped on 6 Nov when they ran out), so the Mac build
  # runs only when something that can break it changes, or by hand
  # (Actions > macOS build > Run workflow, or gh workflow run mac-build.yml).
  push:
    branches: [macos, main]
    paths:
      - "frontend/public/electron.js"
      - "frontend/public/preload.js"
      # The on-screen test checks the interface too.
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/yarn.lock"
      - "backend/requirements*.txt"
      - "backend/core_packages.py"
      - "data/modules/manifest.json"
      - "tools/build/**"
      - "build-mac.sh"
      - ".github/workflows/mac-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # requirements-lqtpy.txt brings lqtpy (a pinned release wheel, not in
      # requirements.txt; a dev machine has its own checkout installed).
      - name: Install the dev environment
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-frozen.txt -r backend/requirements-lqtpy.txt httpx
      - name: pytest
        working-directory: backend
        run: python -m pytest tests -q

  build:
    name: Disk image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          # GitHub's Intel macOS image.
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # electron-builder must not look for a signing identity (the build is
      # ad-hoc signed by the afterPack hook instead).
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22: the on-screen test uses its built-in WebSocket.
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Cache pinned downloads
        uses: actions/cache@v4
        with:
          path: tools/build/downloads
          key: downloads-${{ matrix.arch }}-${{ hashFiles('tools/build/assemble-bundle.sh') }}

      - name: Assemble the bundle
        run: bash tools/build/assemble-bundle.sh --arch ${{ matrix.arch }}

      - name: Smoke test the bundle
        run: bash tools/build/mac-smoke-test.sh bundle

      - name: Package the disk image
        working-directory: frontend
        run: yarn dist:mac:${{ matrix.arch }}

      - name: Smoke test the app
        run: bash tools/build/mac-smoke-test.sh app

      # Advisory on Intel: GitHub's Intel Macs have no GPU, and Chromium's
      # software drawing there now and then freezes the page for minutes (10 Nov:
      # one run passed every step, the next froze before dismissing the home
      # screen). It still runs and uploads its screenshots; Apple Silicon (a
      # real Mac GPU), Windows and Linux keep it strict, and the Intel build
      # keeps its strict launch-and-quit test above. One retry with a fresh app
      # (a pass on retry still warns); a failure on Intel shows as a warning on
      # the run's page, with stack samples of the stuck processes in the
      # artifact. Tried and dropped: SwiftShader (--use-angle=swiftshader),
      # which froze both attempts at the home screen (10 Nov).
      - name: On-screen test
        id: ui
        continue-on-error: ${{ matrix.arch == 'x64' }}
        env:
          UI_SMOKE_RETRIES: "1"
          UI_SMOKE_SIZE: ${{ matrix.arch == 'x64' && '1024x700' || '1280x800' }}
        run: node tools/build/ui-smoke.mjs "$(ls -d ../MRLatte-build/electron/mac*/MRLatte.app | head -1)/Contents/MacOS/MRLatte" ui-shots

      - name: Note an advisory on-screen failure
        if: steps.ui.outcome == 'failure'
        run: echo "::warning title=On-screen test failed (Intel Mac, advisory)::The on-screen test failed on the Intel Mac runner; the build carries on. Look at the ui-shots-mac-x64 artifact (zz- screenshots and the process samples) and this job's log."

      # Diagnostic, Intel only: there WebGL goes through ANGLE's OpenGL backend
      # into Apple's software renderer (sampled 11 Nov), while the runner's
      # virtual GPU does run Metal. Does the same test pass with Metal WebGL?
      # The answer decides whether the app should ask for it on such machines.
      - name: On-screen test with Metal WebGL (diagnostic)
        if: matrix.arch == 'x64'
        continue-on-error: true
        env:
          UI_SMOKE_RETRIES: "0"
          UI_SMOKE_SIZE: 1024x700
          UI_SMOKE_FLAGS: --use-angle=metal
        run: node tools/build/ui-smoke.mjs "$(ls -d ../MRLatte-build/electron/mac*/MRLatte.app | head -1)/Contents/MacOS/MRLatte" ui-shots/metal

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-shots-mac-${{ matrix.arch }}
          path: ui-shots
          if-no-files-found: ignore
          retention-days: 14

      # upload-artifact only takes paths inside the workspace; the build output
      # sits beside the repo (package.json directories.output).
      # With the disk image: its .blockmap and electron-builder's update file,
      # renamed by architecture (each arch writes its own latest-mac.yml).
      - name: Collect the disk image
        run: |
          mkdir -p dist
          cp ../MRLatte-build/electron/*.dmg dist/
          cp ../MRLatte-build/electron/*.dmg.blockmap dist/ 2>/dev/null || true
          cp ../MRLatte-build/electron/latest-mac.yml dist/latest-mac-${{ matrix.arch }}.yml 2>/dev/null || true
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: MRLatte-mac-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
